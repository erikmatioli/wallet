# Included by every location that answers with the app's own files (ADR-001, decision 3). nginx drops the
# server-level add_header of a location that sets its own, so they live here and each location includes them.
# style-src needs 'unsafe-inline': Angular puts each component's styles in a <style> tag. Scripts only from
# this origin - inline critical CSS is off in angular.json, it would need an inline handler.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
