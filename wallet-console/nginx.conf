server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API lives behind the same origin as the console: the browser only ever talks to this
    # nginx, which forwards /v1/** to the wallet-core container. Same-origin means no CORS
    # configuration to maintain on the backend, and no backend URL baked into the JS bundle.
    # "wallet-core" is the service name from wallet-core/docker-compose.yml.
    location /v1/ {
        proxy_pass http://wallet-core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass http://wallet-core:8080;
    }

    # Schedules are wallet-scheduler's API (same tokens: wallet-core issues them). The longer prefix
    # wins over /v1/. The upstream goes through a variable, resolved per request by Docker's DNS, so
    # the console still starts when the scheduler is not running - only this page's calls fail then.
    location /v1/schedules {
        resolver 127.0.0.11 valid=30s;
        set $scheduler http://wallet-scheduler:8082;
        proxy_pass $scheduler;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed JS/CSS bundles can be cached forever; index.html must always be revalidated so a
    # new deploy is picked up immediately.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any unknown path (e.g. a deep link to /accounts/<id>) serves index.html and
    # lets the Angular router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
