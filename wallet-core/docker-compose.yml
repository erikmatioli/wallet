services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet_owner        # schema owner: used only by Flyway migrations
      POSTGRES_PASSWORD: wallet_owner
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro   # creates the runtime role wallet_app
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_owner -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20

  wallet-core:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev        # creates the demo tenant; remove outside development
      DB_URL: jdbc:postgresql://postgres:5432/wallet
      DB_USER: wallet_app
      DB_PASSWORD: wallet_app
      DB_MIGRATION_USER: wallet_owner
      DB_MIGRATION_PASSWORD: wallet_owner

      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: wallet-core

      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"

      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      # Copies tenant_id from the MDC (TenantLoggingInterceptor) onto each exported log record,
      # so Loki can filter by tenant (Wallet Core — Logs dashboard).
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: "tenant_id"

      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev"
      OTEL_TRACES_SAMPLER: "always_on"     # trace every request locally; use parentbased_traceidratio in production
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------------------------
  # Local observability stack (Prometheus, Jaeger, Loki, Grafana, OTel Collector)
  # ---------------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./docker/otel-collector/config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4318:4318"   # OTLP/HTTP, used by wallet-core
    depends_on:
      - jaeger
      - loki

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI: http://localhost:16686

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"     # Prometheus UI, incl. Alerts tab: http://localhost:9090/alerts
    depends_on:
      - wallet-core

  # Novo: Loki para centralização de logs
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # Novo: Grafana para unificar visualização de Logs, Métricas e Traces
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki
      - jaeger
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro   # Prometheus, Loki and Jaeger data sources
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro       # Wallet Core dashboards (Negócio, Serviço, Logs)
      - grafandata:/var/lib/grafana

volumes:
  pgdata:
  promdata:
  grafandata: