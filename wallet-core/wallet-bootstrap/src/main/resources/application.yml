spring:
  application:
    name: wallet-core
  threads:
    virtual:
      enabled: true            # request threads and @Scheduled run on virtual threads
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet_app}       # least-privilege runtime role (subject to Row Level Security)
    password: ${DB_PASSWORD:wallet_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      max-lifetime: 1800000
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    user: ${DB_MIGRATION_USER:wallet_owner}   # schema owner, used only for migrations
    password: ${DB_MIGRATION_PASSWORD:wallet_owner}
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    # tenant_id comes from TenantLoggingInterceptor; traceId/spanId from Micrometer Tracing.
    # Together they let you grep one tenant's logs, or jump from a log line straight to its trace.
    level: "%5p [tenant_id=%X{tenant_id:-},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        wallet.db.transaction: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        wallet.db.transaction: 0.5,0.95,0.99
  tracing:
    # 1.0 (every request) is fine at this volume; lower it (e.g. 0.1) once traffic grows enough
    # that 100% sampling would cost more in collector/storage than the visibility is worth.
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # Spring Boot 4.1 renamed the OTLP tracing property from the Spring Boot 3.x
  # "management.otlp.tracing.endpoint" (which is now silently ignored - no error, it just
  # never binds) to the key below. If traces stop reaching the collector after a Spring Boot
  # upgrade, check this property name against the version's OtlpTracingProperties Javadoc first.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

wallet:
  security:
    jwt:
      issuer: wallet-core
      ttl: 10m
      key-id: wallet-core-1
      # private-key-path: /run/secrets/jwt-private.pem   # PKCS#8 PEM
      # public-key-path: /run/secrets/jwt-public.pem     # X.509 PEM
  outbox:
    poll-interval-ms: 500
    batch-size: 100
  observability:
    audit-sweep:
      enabled: ${AUDIT_SWEEP_ENABLED:true}
      accounts-per-tenant: ${AUDIT_SWEEP_ACCOUNTS_PER_TENANT:200}
      interval-ms: ${AUDIT_SWEEP_INTERVAL_MS:300000}     # every 5 minutes
      initial-delay-ms: ${AUDIT_SWEEP_INITIAL_DELAY_MS:60000}
