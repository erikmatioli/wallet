spring:
  application:
    name: wallet-core
  threads:
    virtual:
      enabled: true            # request threads and @Scheduled run on virtual threads
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet_app}       # least-privilege runtime role (subject to Row Level Security)
    password: ${DB_PASSWORD:wallet_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      max-lifetime: 1800000
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    user: ${DB_MIGRATION_USER:wallet_owner}   # schema owner, used only for migrations
    password: ${DB_MIGRATION_PASSWORD:wallet_owner}
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    # tenant_id comes from TenantLoggingInterceptor; trace_id/span_id are injected into the MDC by
    # the OpenTelemetry Java agent (see docker-compose.yml). Together they let you grep one tenant's
    # logs, or jump from a log line straight to its trace. Without the agent they print empty.
    level: "%5p [tenant_id=%X{tenant_id:-},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
  level:
    root: INFO
    # Força o Spring a logar quando um argumento de DTO falha na validação (@Valid)
    org.springframework.web.servlet.mvc.support: DEBUG
    org.springframework.web.method.annotation.MethodArgumentValidationException: DEBUG
    org.springframework.validation.beanvalidation: DEBUG
    # Opcional: para ver se o tenant chegou a ser extraído antes da rejeição
    br.com.walletcore.adapter.in.rest: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        wallet.db.transaction: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        wallet.db.transaction: 0.5,0.95,0.99
  # Tracing (spans + OTLP export) is done by the OpenTelemetry Java agent, configured through
  # OTEL_* environment variables - see docker-compose.yml. Nothing to configure here.

wallet:
  security:
    jwt:
      issuer: wallet-core
      ttl: 10m
      key-id: wallet-core-1
      # private-key-path: /run/secrets/jwt-private.pem   # PKCS#8 PEM
      # public-key-path: /run/secrets/jwt-public.pem     # X.509 PEM
  outbox:
    poll-interval-ms: 500
    batch-size: 100
  observability:
    audit-sweep:
      enabled: ${AUDIT_SWEEP_ENABLED:true}
      accounts-per-tenant: ${AUDIT_SWEEP_ACCOUNTS_PER_TENANT:200}
      interval-ms: ${AUDIT_SWEEP_INTERVAL_MS:300000}     # every 5 minutes
      initial-delay-ms: ${AUDIT_SWEEP_INITIAL_DELAY_MS:60000}
