name: CI - wallet-otp

# Same model as ci-wallet-scheduler.yml (ADR-009): its own caller workflow, the shared build-test.yml with
# project-dir, and path filters so other projects' changes don't run this. build-test.yml runs
# "mvn -B verify", and the Kotlin compiler comes in through Maven, so nothing Kotlin-specific is needed.
on:
  pull_request:
    branches: [main]
    paths:
      - "wallet-otp/**"
      - ".github/workflows/ci-wallet-otp.yml"
      - ".github/workflows/build-test.yml"
  push:
    branches: [main]
    paths:
      - "wallet-otp/**"
      - ".github/workflows/ci-wallet-otp.yml"
      - ".github/workflows/build-test.yml"

concurrency:
  group: ci-wallet-otp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml
    with:
      project-dir: wallet-otp

  docker:
    name: Docker build
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: wallet-otp
          push: false
          tags: wallet-otp:ci
