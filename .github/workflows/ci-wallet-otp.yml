name: CI - wallet-otp

# Same model as ci-wallet-scheduler.yml (ADR-009): its own caller workflow, the shared build-test.yml with
# project-dir, and path filters so other projects' changes don't run this. build-test.yml runs
# "mvn -B verify", and the Kotlin compiler comes in through Maven, so nothing Kotlin-specific is needed.
on:
  pull_request:
    branches: [main]
    # "edited" so that fixing the PR title re-runs pr-title (the default types don't include it).
    # The build jobs skip that event: a title change doesn't change the code.
    types: [opened, synchronize, reopened, edited]
    paths:
      - "wallet-otp/**"
      - ".github/workflows/ci-wallet-otp.yml"
      - ".github/workflows/build-test.yml"
  push:
    branches: [main]
    paths:
      - "wallet-otp/**"
      - ".github/workflows/ci-wallet-otp.yml"
      - ".github/workflows/build-test.yml"

concurrency:
  # Title edits get their own group: otherwise editing the title would cancel a build in progress.
  group: ci-wallet-otp-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Same check as the other projects' workflows, which never run on wallet-otp-only PRs
      # because of their path filters. Squash-merge uses the PR title as the commit message on main.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # GitHub cuts long titles taken from a commit subject and appends "…"; that cut text
          # would become main's commit message. A conventional prefix alone doesn't catch it.
          subjectPattern: ^(?!.*…$).+$
          subjectPatternError: |
            O título termina em "…": o GitHub cortou o assunto do commit. Escreva o título completo.

  build-test:
    if: github.event.action != 'edited'
    uses: ./.github/workflows/build-test.yml
    with:
      project-dir: wallet-otp

  docker:
    name: Docker build
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: wallet-otp
          push: false
          tags: wallet-otp:ci
