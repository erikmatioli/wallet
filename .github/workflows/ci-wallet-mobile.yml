name: CI - wallet-mobile (M-Wall)

# Same model as ci-wallet-pix.yml: its own caller workflow with path filters, so mobile-only PRs
# get checks (none of the other workflows run for wallet-mobile/**) and other projects don't run this.
on:
  pull_request:
    branches: [main]
    paths:
      - "wallet-mobile/**"
      - ".github/workflows/ci-wallet-mobile.yml"
  push:
    branches: [main]
    paths:
      - "wallet-mobile/**"
      - ".github/workflows/ci-wallet-mobile.yml"

concurrency:
  group: ci-wallet-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet-mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Same major as the Dockerfile's build stage.
          node-version: 22
          cache: npm
          cache-dependency-path: wallet-mobile/package-lock.json

      - run: npm ci

      - run: npm run build

      # Vitest via @angular/build:unit-test; --watch=false so the run exits instead of waiting.
      - run: npm test -- --watch=false

  docker:
    name: Docker build
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: wallet-mobile
          push: false
          tags: wallet-mobile:ci
