name: CI - wallet-fees

# The fee basket (its ADR-001) is .NET, so it does not use the Maven build-test.yml: same shape as the others
# (path filters, tests, then the image), with the .NET SDK. The Postgres tests use Testcontainers, which runs on the
# runner's Docker.
on:
  pull_request:
    branches: [main]
    paths:
      - "wallet-fees/**"
      - ".github/workflows/ci-wallet-fees.yml"
  push:
    branches: [main]
    paths:
      - "wallet-fees/**"
      - ".github/workflows/ci-wallet-fees.yml"

concurrency:
  group: ci-wallet-fees-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet-fees
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test WalletFees.slnx

  docker:
    name: Docker build
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: wallet-fees
          push: false
          tags: wallet-fees:ci
