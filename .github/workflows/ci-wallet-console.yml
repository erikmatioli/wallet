name: CI - wallet-console

# Same model as ci-wallet-pix.yml: its own caller workflow with path filters, so console-only PRs
# get checks (none of the other workflows run for wallet-console/**) and other projects don't run this.
on:
  pull_request:
    branches: [main]
    paths:
      - "wallet-console/**"
      - ".github/workflows/ci-wallet-console.yml"
  push:
    branches: [main]
    paths:
      - "wallet-console/**"
      - ".github/workflows/ci-wallet-console.yml"

concurrency:
  group: ci-wallet-console-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet-console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # Same major as the Dockerfile's build stage.
          node-version: 22
          cache: npm
          cache-dependency-path: wallet-console/package-lock.json

      - run: npm ci

      - run: npm run build

      # Vitest via @angular/build:unit-test; --watch=false so the run exits instead of waiting.
      - run: npm test -- --watch=false

  docker:
    name: Docker build
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: wallet-console
          push: false
          tags: wallet-console:ci
