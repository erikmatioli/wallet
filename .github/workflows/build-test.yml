name: Build & test (reusable)

# Reusable workflow: the single source of truth for "does this codebase build and pass its
# tests". Called by both ci.yml (every push/PR) and release.yml (every tag) so the two never
# drift apart - a release is never built from a path that CI didn't already verify.
#
# Takes project-dir so the same workflow can be reused by other projects that may join this
# repo later (a monorepo) - each project's own caller workflow just passes its own subfolder.
on:
  workflow_call:
    inputs:
      project-dir:
        description: "Subfolder containing this project's pom.xml (repo root if empty)"
        required: false
        type: string
        default: wallet-core

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ inputs.project-dir }}/**/pom.xml

      # ubuntu-latest ships Docker pre-installed and running, which is what
      # WalletCoreConcurrencyTest needs (Testcontainers starts a throwaway PostgreSQL).
      - name: Verify Docker is available (required by Testcontainers)
        run: docker info

      # -B: batch mode (no interactive prompts/ANSI art in logs).
      # Runs every module: wallet-domain/wallet-application unit tests, ArchUnit rules,
      # and wallet-bootstrap's WalletCoreConcurrencyTest (real PostgreSQL via Testcontainers).
      - name: mvn verify
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-${{ inputs.project-dir }}
          path: |
            ${{ inputs.project-dir }}/**/target/surefire-reports/**
            ${{ inputs.project-dir }}/**/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14
