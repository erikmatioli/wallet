name: CI - wallet-pix

# Same model as ci.yml (wallet-core), per ADR-009: its own caller workflow, the shared
# build-test.yml with project-dir, and path filters so wallet-core changes don't run this.
on:
  pull_request:
    branches: [main]
    # "edited" so that fixing the PR title re-runs pr-title (the default types don't include it).
    # The build jobs skip that event: a title change doesn't change the code.
    types: [opened, synchronize, reopened, edited]
    paths:
      - "wallet-pix/**"
      - ".github/workflows/ci-wallet-pix.yml"
      - ".github/workflows/build-test.yml"
  push:
    branches: [main]
    paths:
      - "wallet-pix/**"
      - ".github/workflows/ci-wallet-pix.yml"
      - ".github/workflows/build-test.yml"

concurrency:
  # Title edits get their own group: otherwise editing the title would cancel a build in progress.
  group: ci-wallet-pix-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Same check as ci.yml (wallet-core), which never runs on wallet-pix-only PRs because of its
      # path filter. Squash-merge uses the PR title as the commit message on main.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # GitHub cuts long titles taken from a commit subject and appends "…"; that cut text
          # would become main's commit message. A conventional prefix alone doesn't catch it.
          subjectPattern: ^(?!.*…$).+$
          subjectPatternError: |
            O título termina em "…": o GitHub cortou o assunto do commit. Escreva o título completo.

  build-test:
    if: github.event.action != 'edited'
    uses: ./.github/workflows/build-test.yml
    with:
      project-dir: wallet-pix

  docker:
    name: Docker build (${{ matrix.module }})
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # spi-simulator is built to keep its Dockerfile path honest; it is never published.
        module: [pix-service, spi-simulator]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: wallet-pix
          build-args: MODULE=${{ matrix.module }}
          push: false
          tags: wallet-pix/${{ matrix.module }}:ci
